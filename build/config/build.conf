# ============================================================
#  Winux — configuracoes de build
#  Alvo: ASUS desktop (i7-4771 Haswell, GTX 1060 6GB)
# ============================================================

DISTRO_NAME=winux
DISTRO_VER=0.1

# Kernel: mesma linha que o repo linux ja compila
KVER=6.18.54

# Otimizacao de instrucoes p/ a Haswell (AVX2). Desempenho > portabilidade.
# ponytail: -march=haswell assume CPU == maquina alvo. Se portar p/ outra
# maquina, troque por -march=x86-64-v3 ou remova.
KCFLAGS="-march=haswell -mtune=haswell -O2"

# Base do userspace (Debian)
DEBIAN_SUITE=trixie
DEBIAN_MIRROR=http://deb.debian.org/debian

# Usuario desktop padrao
DESKTOP_USER=winux

# Midia
ISO_LABEL=WINUX